services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles:
      - rag
    environment:
      # 默认值仅用于本地学习；部署环境必须通过 .env 或 Secret 注入密码。
      POSTGRES_DB: ${POSTGRES_DB:-tradingagents}
      POSTGRES_USER: ${POSTGRES_USER:-tradingagents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradingagents_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tradingagents_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready 只判断数据库是否接受连接，不会修改业务数据。
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tradingagents} -d ${POSTGRES_DB:-tradingagents}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

  redis:
    image: redis:7-alpine
    profiles:
      - rag
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tradingagents_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    profiles:
      - rag
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - tradingagents_minio_data:/data
    command: server /data --console-address ":9001"

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles:
      - rag
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - tradingagents_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  tei-bge-m3:
    image: ghcr.io/huggingface/text-embeddings-inference:1.8
    profiles:
      - rag-model
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "${BGE_M3_TEI_PORT:-8080}:80"
    volumes:
      - tradingagents_tei_data:/data
    command: ["--model-id", "BAAI/bge-m3", "--pooling", "mean"]

volumes:
  tradingagents_postgres_data:
  tradingagents_data:
  ollama_data:
  tradingagents_redis_data:
  tradingagents_minio_data:
  tradingagents_opensearch_data:
  tradingagents_tei_data:
